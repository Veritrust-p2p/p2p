# Render Blueprint for the VeriTrust API.
#
# Region is the load-bearing line here. The database is a Neon project in
# eu-central-1 (Frankfurt), and every request this API serves is several round
# trips to it — measured at 129ms from Frankfurt against 224ms from us-east-2,
# and the dashboard alone is two of those. Deploying to Render's default Oregon
# region would put an ocean between the API and its database and undo the whole
# reason the database was moved. If the database ever moves, move this with it.
#
# Secrets are `sync: false`: Render prompts for them once in the dashboard and
# keeps them out of the repo. The three the server refuses to boot without are
# DATABASE_URL, JWT_ACCESS_SECRET and JWT_REFRESH_SECRET (see shared/config/env.ts).
services:
  - type: web
    name: p2p-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: server

    # `--include=dev --include=optional` is load bearing. NODE_ENV=production is
    # set below (CORS needs it — isAllowedOrigin only refuses LAN origins in
    # production), and npm reads NODE_ENV too: it omits devDependencies. But
    # TypeScript is a devDependency and is needed to build, and TypeScript 7 is
    # the native compiler, so it resolves a per-platform binary
    # (@typescript/typescript-linux-x64) that the lockfile records as both dev
    # and optional. Omit either and `tsc` installs but dies at startup with
    # "Unable to resolve @typescript/typescript-linux-x64".
    #
    # `prisma generate` is not optional either: src/generated/ is gitignored, so
    # the client does not exist in a fresh checkout. `migrate deploy` applies any
    # pending migration before the new code that expects it starts serving.
    buildCommand: npm ci --include=dev --include=optional && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start

    # Cheap and unauthenticated — see features/health. Note the path is /health,
    # not /api/health.
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      # PORT is deliberately absent. Render injects it and expects the process
      # to bind whatever it says; hardcoding one is how a service ends up
      # listening where nothing is routed.

      # ---- required: the server throws on boot without these ----
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false

      # ---- origins ----
      # WEB_ORIGIN builds links in outgoing email. CORS_ORIGINS is the allowlist
      # for both the REST API and the WebSocket handshake — in production
      # nothing else is accepted, so the deployed web URL must be in it.
      # SERVER_ORIGIN is this service's own public URL, which is where
      # NOWPayments posts its IPN; without it crypto deposits can only settle
      # from the buyer's redirect.
      - key: WEB_ORIGIN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SERVER_ORIGIN
        sync: false

      # ---- uploads ----
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # ---- payments (test keys only; see env.ts on why live keys are refused) ----
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: NOWPAYMENTS_API_KEY
        sync: false
      - key: NOWPAYMENTS_IPN_SECRET
        sync: false
      - key: NOWPAYMENTS_BASE_URL
        value: https://api-sandbox.nowpayments.io/v1

      # Funds a crypto deal on provider status alone, ignoring the amount
      # received. Required against the sandbox, which reports `actually_paid: 0`
      # for every payment however it was made — without this a settled deposit
      # credits nothing and the deal cannot fund.
      #
      # On by default here, and safe to be, because the guard is in code rather
      # than in this value: `nowpaymentsTrustStatus()` requires the base URL
      # above to be a sandbox one, so pointing this service at live keys
      # restores the amount check by itself with nothing to remember.
      #
      # It was "false" first, on the reasoning that an escape hatch should be
      # off by default. That reasoning was wrong twice over — it ignores the
      # guard, and it broke the one flow it was protecting.
      - key: NOWPAYMENTS_TRUST_STATUS
        value: "true"

      # ---- email ----
      # All `sync: false` — set in the dashboard, never in git.
      #
      # MAIL_DRIVER was pinned to `simulated` here, which is why the hosted
      # server logged `[mail:simulated]` and sent nothing no matter what the
      # dashboard said: a literal `value:` is blueprint-managed, so every sync
      # overwrote the dashboard back to `simulated`.
      #
      # Set it to `resend`, NOT `smtp`. Render blocks outbound SMTP: a send to
      # smtp.gmail.com:587 from here times out, and since nothing reaches a mail
      # server, nothing bounces — the mail just disappears. The same credentials
      # authenticate against Gmail from a laptop in under a second, so this is
      # the network, not the config. Resend goes over :443 instead.
      #
      # MAIL_FROM must be an address the provider has authorised, or the mail is
      # rejected or silently rewritten.
      - key: MAIL_DRIVER
        sync: false
      - key: MAIL_FROM
        sync: false
      # MAIL_DRIVER=resend
      - key: RESEND_API_KEY
        sync: false
      # MAIL_DRIVER=smtp — kept so a host that permits SMTP can still use it.
      # 587 = STARTTLS, 465 = implicit TLS; the code derives TLS mode from the
      # port, so the two must agree.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      # Gmail requires a 16-character App Password (2FA on the account), not the
      # account password.
      - key: SMTP_PASS
        sync: false
